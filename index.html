<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ALMA Maps | خرائط ألما</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      font-family: Arial, sans-serif;
    }

    #map {
      width: 100%;
      height: 100vh;
    }

    .alma-panel {
      position: absolute;
      top: 18px;
      right: 18px;
      z-index: 1000;
      width: min(410px, calc(100% - 36px));
      background: rgba(255,255,255,.97);
      border-radius: 20px;
      padding: 16px;
      box-shadow: 0 7px 30px rgba(0,0,0,.20);
    }

    html[dir="ltr"] .alma-panel {
      right: auto;
      left: 18px;
    }

    .top-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 15px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo {
      width: 46px;
      height: 46px;
      border-radius: 13px;
      background: #146c43;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 20px;
    }

    .brand h1 {
      margin: 0;
      font-size: 22px;
      color: #1f2937;
    }

    .brand p {
      margin: 3px 0 0;
      color: #6b7280;
      font-size: 12px;
    }

    #languageSelect {
      border: 1px solid #d1d5db;
      border-radius: 10px;
      padding: 8px;
      background: white;
      max-width: 105px;
    }

    .route-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 9px;
    }

    .route-icon {
      width: 28px;
      text-align: center;
      font-size: 18px;
    }

    .route-row input {
      flex: 1;
      min-width: 0;
      border: 1px solid #d1d5db;
      border-radius: 11px;
      padding: 12px;
      font-size: 15px;
      outline: none;
    }

    .route-row input:focus {
      border-color: #146c43;
    }

    .my-location {
      margin: 2px 36px 12px 0;
      border: 0;
      background: transparent;
      color: #146c43;
      font-size: 13px;
      cursor: pointer;
      padding: 0;
    }

    html[dir="ltr"] .my-location {
      margin: 2px 0 12px 36px;
    }

    .route-button {
      width: 100%;
      border: 0;
      border-radius: 11px;
      padding: 13px;
      background: #146c43;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .route-button:disabled {
      opacity: .65;
      cursor: wait;
    }

    .route-result {
      display: none;
      margin-top: 12px;
      background: #f3f4f6;
      border-radius: 12px;
      padding: 12px;
      color: #1f2937;
    }

    .route-summary {
      display: flex;
      justify-content: space-around;
      text-align: center;
      gap: 10px;
    }

    .route-summary strong {
      display: block;
      font-size: 18px;
      margin-bottom: 3px;
    }

    .route-summary span {
      color: #6b7280;
      font-size: 12px;
    }

    .status {
      display: none;
      margin-top: 10px;
      text-align: center;
      font-size: 13px;
      color: #4b5563;
    }

    @media (max-width: 600px) {
      .alma-panel {
        top: 8px;
        right: 8px;
        width: calc(100% - 16px);
      }

      html[dir="ltr"] .alma-panel {
        left: 8px;
        right: auto;
      }
    }
  </style>
</head>

<body>

  <div class="alma-panel">

    <div class="top-row">

      <div class="brand">
        <div class="logo">A</div>

        <div>
          <h1>ALMA Maps</h1>
          <p id="subtitle">دليلك الذكي في العراق</p>
        </div>
      </div>

      <select id="languageSelect">
        <option value="ar">العربية</option>
        <option value="ku">کوردی</option>
        <option value="en">English</option>
        <option value="tr">Türkçe</option>
        <option value="fa">فارسی</option>
      </select>

    </div>

    <div class="route-row">
      <div class="route-icon">●</div>

      <input
        id="fromInput"
        type="text"
        placeholder="من أين؟"
      >
    </div>

    <button
      id="myLocationButton"
      class="my-location"
      onclick="useMyLocation()"
    >
      📍 استخدم موقعي الحالي
    </button>

    <div class="route-row">
      <div class="route-icon">🏁</div>

      <input
        id="toInput"
        type="text"
        placeholder="إلى أين؟"
      >
    </div>

    <button
      id="routeButton"
      class="route-button"
      onclick="calculateRoute()"
    >
      🚗 احسب الطريق
    </button>

    <div id="status" class="status"></div>

    <div id="routeResult" class="route-result">
      <div class="route-summary">

        <div>
          <strong id="distanceValue">—</strong>
          <span id="distanceLabel">المسافة</span>
        </div>

        <div>
          <strong id="durationValue">—</strong>
          <span id="durationLabel">الوقت التقريبي</span>
        </div>

      </div>
    </div>

  </div>

  <div id="map"></div>

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
  </script>

  <script>

    const translations = {

      ar: {
        subtitle: "دليلك الذكي في العراق",
        from: "من أين؟",
        to: "إلى أين؟",
        myLocation: "📍 استخدم موقعي الحالي",
        route: "🚗 احسب الطريق",
        distance: "المسافة",
        duration: "الوقت التقريبي",
        searching: "جارٍ البحث عن المواقع...",
        calculating: "جارٍ حساب الطريق...",
        notFound: "لم يتم العثور على أحد الموقعين.",
        routeError: "تعذر حساب الطريق حالياً.",
        enterPlaces: "أدخل نقطة الانطلاق والوجهة.",
        locating: "جارٍ تحديد موقعك...",
        locationReady: "تم تحديد موقعك.",
        currentLocation: "موقعي الحالي",
        locationError: "تعذر تحديد موقعك.",
        km: "كم",
        min: "دقيقة",
        hour: "ساعة"
      },

      ku: {
        subtitle: "ڕێبەری زیرەکی تۆ لە عێراق",
        from: "لە کوێوە؟",
        to: "بۆ کوێ؟",
        myLocation: "📍 شوێنی ئێستام بەکاربهێنە",
        route: "🚗 ڕێگا دیاری بکە",
        distance: "دووری",
        duration: "کاتی خەمڵێنراو",
        searching: "گەڕان بۆ شوێنەکان...",
        calculating: "ڕێگا هەژمار دەکرێت...",
        notFound: "یەکێک لە شوێنەکان نەدۆزرایەوە.",
        routeError: "نەتوانرا ڕێگا دیاری بکرێت.",
        enterPlaces: "شوێنی دەستپێک و مەبەست بنووسە.",
        locating: "شوێنت دیاری دەکرێت...",
        locationReady: "شوێنت دیاری کرا.",
        currentLocation: "شوێنی ئێستام",
        locationError: "نەتوانرا شوێنت دیاری بکرێت.",
        km: "کم",
        min: "خولەک",
        hour: "کاتژمێر"
      },

      en: {
        subtitle: "Your smart guide in Iraq",
        from: "From where?",
        to: "Where to?",
        myLocation: "📍 Use my current location",
        route: "🚗 Calculate route",
        distance: "Distance",
        duration: "Estimated time",
        searching: "Searching for locations...",
        calculating: "Calculating route...",
        notFound: "One of the locations could not be found.",
        routeError: "The route could not be calculated.",
        enterPlaces: "Enter a starting point and destination.",
        locating: "Locating you...",
        locationReady: "Your location is ready.",
        currentLocation: "My current location",
        locationError: "Unable to determine your location.",
        km: "km",
        min: "min",
        hour: "hr"
      },

      tr: {
        subtitle: "Irak'taki akıllı rehberiniz",
        from: "Nereden?",
        to: "Nereye?",
        myLocation: "📍 Mevcut konumumu kullan",
        route: "🚗 Rotayı hesapla",
        distance: "Mesafe",
        duration: "Tahmini süre",
        searching: "Konumlar aranıyor...",
        calculating: "Rota hesaplanıyor...",
        notFound: "Konumlardan biri bulunamadı.",
        routeError: "Rota hesaplanamadı.",
        enterPlaces: "Başlangıç ve varış noktası girin.",
        locating: "Konumunuz belirleniyor...",
        locationReady: "Konumunuz hazır.",
        currentLocation: "Mevcut konumum",
        locationError: "Konumunuz belirlenemedi.",
        km: "km",
        min: "dk",
        hour: "sa"
      },

      fa: {
        subtitle: "راهنمای هوشمند شما در عراق",
        from: "از کجا؟",
        to: "به کجا؟",
        myLocation: "📍 استفاده از موقعیت فعلی من",
        route: "🚗 محاسبه مسیر",
        distance: "مسافت",
        duration: "زمان تقریبی",
        searching: "در حال جستجوی مکان‌ها...",
        calculating: "در حال محاسبه مسیر...",
        notFound: "یکی از مکان‌ها پیدا نشد.",
        routeError: "مسیر قابل محاسبه نیست.",
        enterPlaces: "مبدأ و مقصد را وارد کنید.",
        locating: "در حال تعیین موقعیت شما...",
        locationReady: "موقعیت شما آماده است.",
        currentLocation: "موقعیت فعلی من",
        locationError: "موقعیت شما تعیین نشد.",
        km: "کیلومتر",
        min: "دقیقه",
        hour: "ساعت"
      }
    };

    const directions = {
      ar: "rtl",
      ku: "rtl",
      en: "ltr",
      tr: "ltr",
      fa: "rtl"
    };

    let currentLanguage = "ar";

    let currentLocationCoordinates = null;

    let startMarker = null;
    let destinationMarker = null;
    let routeLine = null;

    const map = L.map("map").setView(
      [33.2232, 43.6793],
      6
    );

    L.tileLayer(
      "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
      {
        maxZoom: 19,
        attribution: "&copy; OpenStreetMap contributors"
      }
    ).addTo(map);


    function setLanguage(language) {

      currentLanguage = language;

      const t = translations[language];

      document.documentElement.lang = language;
      document.documentElement.dir = directions[language];

      document.getElementById("subtitle").textContent =
        t.subtitle;

      document.getElementById("fromInput").placeholder =
        t.from;

      document.getElementById("toInput").placeholder =
        t.to;

      document.getElementById("myLocationButton").textContent =
        t.myLocation;

      document.getElementById("routeButton").textContent =
        t.route;

      document.getElementById("distanceLabel").textContent =
        t.distance;

      document.getElementById("durationLabel").textContent =
        t.duration;

      localStorage.setItem("almaLanguage", language);

      setTimeout(function() {
        map.invalidateSize();
      }, 100);
    }


    function showStatus(message) {

      const status =
        document.getElementById("status");

      status.textContent = message;
      status.style.display = "block";
    }


    function hideStatus() {

      document.getElementById("status").style.display =
        "none";
    }


    async function geocodePlace(query) {

      const url =
        "https://nominatim.openstreetmap.org/search" +
        "?format=json" +
        "&limit=1" +
        "&countrycodes=iq" +
        "&accept-language=" +
        encodeURIComponent(currentLanguage) +
        "&q=" +
        encodeURIComponent(query);

      const response = await fetch(url);

      if (!response.ok) {
        throw new Error("Geocoding error");
      }

      const data = await response.json();

      if (!data.length) {
        return null;
      }

      return {
        lat: Number(data[0].lat),
        lon: Number(data[0].lon),
        name: data[0].display_name
      };
    }


    function useMyLocation() {

      const t = translations[currentLanguage];

      if (!navigator.geolocation) {
        alert(t.locationError);
        return;
      }

      showStatus(t.locating);

      navigator.geolocation.getCurrentPosition(

        function(position) {

          currentLocationCoordinates = {
            lat: position.coords.latitude,
            lon: position.coords.longitude
          };

          document.getElementById("fromInput").value =
            t.currentLocation;

          hideStatus();

          showStatus(t.locationReady);

          setTimeout(hideStatus, 1500);

          map.setView(
            [
              currentLocationCoordinates.lat,
              currentLocationCoordinates.lon
            ],
            15
          );
        },

        function() {
          hideStatus();
          alert(t.locationError);
        },

        {
          enableHighAccuracy: true
        }
      );
    }


    async function calculateRoute() {

      const t = translations[currentLanguage];

      const fromText =
        document.getElementById("fromInput").value.trim();

      const toText =
        document.getElementById("toInput").value.trim();

      if (!fromText || !toText) {
        alert(t.enterPlaces);
        return;
      }

      const button =
        document.getElementById("routeButton");

      button.disabled = true;

      document.getElementById("routeResult").style.display =
        "none";

      try {

        showStatus(t.searching);

        let start;

        if (
          currentLocationCoordinates &&
          fromText === t.currentLocation
        ) {

          start = {
            lat: currentLocationCoordinates.lat,
            lon: currentLocationCoordinates.lon,
            name: t.currentLocation
          };

        } else {

          start = await geocodePlace(fromText);
        }

        const destination =
          await geocodePlace(toText);

        if (!start || !destination) {

          hideStatus();
          alert(t.notFound);
          button.disabled = false;
          return;
        }

        showStatus(t.calculating);

        const routeURL =
          "https://router.project-osrm.org/route/v1/driving/" +
          start.lon + "," + start.lat + ";" +
          destination.lon + "," + destination.lat +
          "?overview=full&geometries=geojson&steps=true";

        const response =
          await fetch(routeURL);

        if (!response.ok) {
          throw new Error("Routing error");
        }

        const routeData =
          await response.json();

        if (
          routeData.code !== "Ok" ||
          !routeData.routes ||
          !routeData.routes.length
        ) {
          throw new Error("No route");
        }

        const route =
          routeData.routes[0];

        if (routeLine) {
          map.removeLayer(routeLine);
        }

        if (startMarker) {
          map.removeLayer(startMarker);
        }

        if (destinationMarker) {
          map.removeLayer(destinationMarker);
        }

        const latLngs =
          route.geometry.coordinates.map(
            function(coordinate) {
              return [
                coordinate[1],
                coordinate[0]
              ];
            }
          );

        routeLine =
          L.polyline(
            latLngs,
            {
              weight: 6,
              opacity: 0.85
            }
          ).addTo(map);

        startMarker =
          L.marker(
            [start.lat, start.lon]
          )
          .addTo(map)
          .bindPopup(start.name);

        destinationMarker =
          L.marker(
            [destination.lat, destination.lon]
          )
          .addTo(map)
          .bindPopup(destination.name);

        map.fitBounds(
          routeLine.getBounds(),
          {
            padding: [45, 45]
          }
        );

        const distanceKm =
          route.distance / 1000;

        const durationMinutes =
          Math.round(route.duration / 60);

        document.getElementById(
          "distanceValue"
        ).textContent =
          distanceKm.toFixed(1) +
          " " +
          t.km;

        document.getElementById(
          "durationValue"
        ).textContent =
          formatDuration(durationMinutes);

        document.getElementById(
          "routeResult"
        ).style.display =
          "block";

        hideStatus();

      } catch (error) {

        hideStatus();
        alert(t.routeError);

      } finally {

        button.disabled = false;
      }
    }


    function formatDuration(minutes) {

      const t =
        translations[currentLanguage];

      if (minutes < 60) {
        return minutes + " " + t.min;
      }

      const hours =
        Math.floor(minutes / 60);

      const remainingMinutes =
        minutes % 60;

      if (remainingMinutes === 0) {
        return hours + " " + t.hour;
      }

      return (
        hours +
        " " +
        t.hour +
        " " +
        remainingMinutes +
        " " +
        t.min
      );
    }


    document
      .getElementById("languageSelect")
      .addEventListener(
        "change",
        function() {
          setLanguage(this.value);
        }
      );


    document
      .getElementById("toInput")
      .addEventListener(
        "keydown",
        function(event) {

          if (event.key === "Enter") {
            calculateRoute();
          }
        }
      );


    const savedLanguage =
      localStorage.getItem("almaLanguage");

    if (
      savedLanguage &&
      translations[savedLanguage]
    ) {

      document.getElementById(
        "languageSelect"
      ).value = savedLanguage;

      setLanguage(savedLanguage);

    } else {

      setLanguage("ar");
    }

  </script>

</body>
</html>
