<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>ALMA Maps | خرائط ألما</title>

<link
  rel="stylesheet"
 href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css"
>

<style>

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  width:100%;
  height:100%;
  font-family:Arial,sans-serif;
  overflow:hidden;
}

#map{
  width:100%;
  height:100vh;
  height:100dvh;
}
#navigationMap{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  display:none;
  z-index:1;
}
.alma-panel{
  position:absolute;
  top:18px;
  right:18px;
  z-index:1000;
  width:min(430px,calc(100% - 36px));
  background:rgba(255,255,255,.97);
  border-radius:20px;
  padding:16px;
  box-shadow:0 7px 30px rgba(0,0,0,.20);
  max-height:calc(100vh - 36px);
  overflow-y:auto;
}

html[dir="ltr"] .alma-panel{
  right:auto;
  left:18px;
}

.top-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin-bottom:15px;
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
}

.logo{
  width:46px;
  height:46px;
  border-radius:13px;
  background:#146c43;
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:bold;
  font-size:20px;
}

.brand h1{
  margin:0;
  font-size:22px;
  color:#1f2937;
}

.brand p{
  margin:3px 0 0;
  color:#6b7280;
  font-size:12px;
}

#languageSelect{
  border:1px solid #d1d5db;
  border-radius:10px;
  padding:8px;
  background:white;
  max-width:110px;
}

.route-row{
  display:flex;
  align-items:center;
  gap:8px;
  margin-bottom:9px;
}

.route-icon{
  width:28px;
  text-align:center;
  font-size:18px;
}

.route-row input{
  flex:1;
  min-width:0;
  border:1px solid #d1d5db;
  border-radius:11px;
  padding:12px;
  font-size:15px;
  outline:none;
}

.route-row input:focus{
  border-color:#146c43;
}

.my-location{
  margin:2px 36px 12px 0;
  border:0;
  background:transparent;
  color:#146c43;
  font-size:13px;
  cursor:pointer;
  padding:0;
}

html[dir="ltr"] .my-location{
  margin:2px 0 12px 36px;
}

.main-button,
.preview-button,
.navigation-button,
.stop-button,
.voice-button{
  width:100%;
  border:0;
  border-radius:11px;
  padding:13px;
  font-size:15px;
  font-weight:bold;
  cursor:pointer;
}

.main-button{
  background:#146c43;
  color:white;
}

.main-button:disabled{
  opacity:.6;
  cursor:wait;
}

.voice-button{
  margin-top:10px;
  background:#f3f4f6;
  color:#111827;
  border:1px solid #d1d5db;
}

.voice-button.active{
  background:#dcfce7;
  color:#166534;
  border-color:#86efac;
}

.preview-button{
  display:none;
  margin-top:10px;
  background:#2563eb;
  color:white;
}

.navigation-button{
  display:none;
  margin-top:8px;
  background:#111827;
  color:white;
}

.stop-button{
  display:none;
  margin-top:8px;
  background:#e5e7eb;
  color:#111827;
}

.route-result{
  display:none;
  margin-top:12px;
  background:#f3f4f6;
  border-radius:12px;
  padding:12px;
}

.route-summary{
  display:flex;
  justify-content:space-around;
  text-align:center;
  gap:10px;
}

.route-summary strong{
  display:block;
  font-size:18px;
  margin-bottom:3px;
}

.route-summary span{
  color:#6b7280;
  font-size:12px;
}

.navigation-box{
  display:none;
  margin-top:12px;
  border-radius:14px;
  padding:14px;
  background:#146c43;
  color:white;
}

.instruction-row{
  display:flex;
  align-items:center;
  gap:13px;
}

#turnIcon{
  font-size:36px;
  min-width:48px;
  text-align:center;
}

#instructionText{
  font-size:18px;
  font-weight:bold;
  line-height:1.5;
}

#instructionDistance{
  margin-top:5px;
  font-size:14px;
  opacity:.92;
}

.progress-wrap{
  margin-top:12px;
  height:6px;
  background:rgba(255,255,255,.3);
  border-radius:10px;
  overflow:hidden;
}

#progressBar{
  width:0%;
  height:100%;
  background:white;
  border-radius:10px;
}

.status{
  display:none;
  margin-top:10px;
  padding:9px;
  border-radius:9px;
  background:#f3f4f6;
  text-align:center;
  font-size:13px;
  color:#4b5563;
}

.live-badge{
  display:none;
  margin-bottom:10px;
  padding:8px 10px;
  border-radius:9px;
  background:#dcfce7;
  color:#166534;
  font-size:12px;
  font-weight:bold;
  text-align:center;
}
/* =====================================================
   ALMA - سيارة الملاحة
   ===================================================== */

.car-icon{
  width:32px;
  height:49px;
  position:relative;
  transform-origin:50% 50%;
  filter:
    drop-shadow(0 3px 3px rgba(0,0,0,.35))
    drop-shadow(0 0 2px rgba(255,255,255,.9));
  will-change:transform;
}

.car-icon svg{
  display:block;
  width:32px;
  height:49px;
  overflow:visible;
}
/* =====================================================
   الهاتف قبل بدء الملاحة
   ===================================================== */

@media(max-width:600px){

  .alma-panel{
    top:8px;
    right:8px;
    width:calc(100% - 16px);
    max-height:65dvh;
  }

  html[dir="ltr"] .alma-panel{
    left:8px;
    right:auto;
  }
}

/* =====================================================
   ALMA - وضع الملاحة الحقيقي على الهاتف
   ===================================================== */

@media(max-width:600px){

  body.mobile-navigation .alma-panel{
    position:fixed;
    top:0;
    right:0;
    left:0;
    width:100%;
    max-height:none;
    padding:0;
    overflow:visible;
    background:transparent;
    border-radius:0;
    box-shadow:none;
    pointer-events:none;
    z-index:1200;
  }

  /*
    إخفاء لوحة البحث بالكامل أثناء القيادة
  */
body.mobile-navigation .top-row,
body.mobile-navigation .route-row,
body.mobile-navigation .my-location,
body.mobile-navigation #status,
body.mobile-navigation #routeResult,
body.mobile-navigation #navigationButton{
  display:none !important;
}

  /*
    بطاقة المناورة الرئيسية
  */

  body.mobile-navigation #navigationBox{
    display:block !important;
    position:fixed;
    top:calc(10px + env(safe-area-inset-top));
    left:10px;
    right:10px;
    width:auto;
    margin:0;
    padding:16px 18px;
    border-radius:22px;
    background:#146c43;
    color:#ffffff;
    box-shadow:
      0 5px 18px rgba(0,0,0,.28);
    pointer-events:auto;
    z-index:1250;
  }

  body.mobile-navigation .instruction-row{
    display:flex;
    align-items:center;
    gap:16px;
  }

  body.mobile-navigation #turnIcon{
    display:flex;
    align-items:center;
    justify-content:center;
    min-width:62px;
    width:62px;
    height:62px;
    font-size:46px;
    line-height:1;
    color:white;
  }

  body.mobile-navigation #instructionText{
    font-size:22px;
    font-weight:700;
    line-height:1.3;
    color:#ffffff;
  }

  body.mobile-navigation #instructionDistance{
    margin-top:5px;
    font-size:16px;
    font-weight:600;
    color:rgba(255,255,255,.90);
  }

  /*
    شريط تقدم رفيع داخل بطاقة الاتجاه
  */

  body.mobile-navigation .progress-wrap{
    height:4px;
    margin-top:12px;
    background:rgba(255,255,255,.24);
    border-radius:20px;
  }

  body.mobile-navigation #progressBar{
    background:#ffffff;
  }

  /*
    حالة الملاحة الحية:
    شارة صغيرة بدلاً من لوحة كبيرة
  */

  body.mobile-navigation #liveBadge{
    position:fixed;
    top:calc(116px + env(safe-area-inset-top));
    left:50%;
    transform:translateX(-50%);
    width:max-content;
    max-width:80%;
    margin:0;
    padding:6px 12px;
    border-radius:18px;
    background:rgba(255,255,255,.94);
    color:#146c43;
    box-shadow:0 2px 8px rgba(0,0,0,.16);
    font-size:11px;
    pointer-events:auto;
    z-index:1240;
  }

  /*
    زر إيقاف الملاحة:
    زر عائم صغير بدل الشريط الكبير
  */

  body.mobile-navigation #stopButton{
    display:flex !important;
    position:fixed;
    right:14px;
    bottom:calc(94px + env(safe-area-inset-bottom));
    width:54px;
    height:54px;
    min-width:54px;
    margin:0;
    padding:0;
    align-items:center;
    justify-content:center;
    border-radius:50%;
    background:#ffffff;
    color:#b91c1c;
    border:0;
    box-shadow:0 3px 14px rgba(0,0,0,.28);
    font-size:0;
    pointer-events:auto;
    z-index:1250;
  }

  body.mobile-navigation #stopButton::before{
    content:"■";
    font-size:21px;
  }


}


/* ===== ALMA: معلومات الرحلة الحية على الهاتف ===== */

.trip-bar{
  display:none;
}

@media(max-width:600px){

  body.mobile-navigation .trip-bar{
    position:fixed;
    left:8px;
    right:8px;
    bottom:calc(8px + env(safe-area-inset-bottom));
    z-index:1100;
    display:flex;
    align-items:stretch;
    justify-content:space-between;
    gap:6px;
    padding:8px;
    border-radius:16px;
    background:rgba(255,255,255,.97);
    box-shadow:0 4px 18px rgba(0,0,0,.22);
  }

  body.mobile-navigation .trip-stat{
    flex:1;
    min-width:0;
    text-align:center;
    padding:4px 2px;
  }

  body.mobile-navigation .trip-stat + .trip-stat{
    border-inline-start:1px solid #e5e7eb;
  }

  body.mobile-navigation .trip-stat strong{
    display:block;
    color:#111827;
    font-size:16px;
    line-height:1.2;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }

  body.mobile-navigation .trip-stat span{
    display:block;
    margin-top:3px;
    color:#6b7280;
    font-size:10px;
    white-space:nowrap;
  }
}
  .alma-search-bar{
  position:fixed;
  top:18px;
  left:50%;
  transform:translateX(-50%);
  z-index:1000;

  width:min(92%,620px);
  height:58px;

  display:flex;
  align-items:center;
  gap:10px;

  padding:0 14px;

  background:#ffffff;
  border-radius:30px;

  box-shadow:
    0 2px 8px rgba(0,0,0,.22);
}

.alma-search-bar input{
  flex:1;
  min-width:0;

  border:0;
  outline:0;
  background:transparent;

  font-size:18px;
  font-family:inherit;
}

.search-icon{
  font-size:27px;
  line-height:1;
}

.microphone-button{
  width:42px;
  height:42px;

  border:0;
  background:transparent;

  font-size:23px;
  cursor:pointer;
}

.alma-start-button{
  position:fixed;
  top:86px;
  left:50%;
  transform:translateX(-50%);
  z-index:1001;

  width:min(88%,380px);
  height:54px;

  border:0;
  border-radius:27px;

  background:#ff1f1f;
  color:#ffffff;

  box-shadow:
    0 4px 14px rgba(255,31,31,.38);

  font-family:inherit;
  font-size:20px;
  font-weight:700;

  cursor:pointer;
}

.alma-start-button:hover{
  background:#e60000;
}

.alma-start-button:active{
  transform:translateX(-50%) scale(.98);
}
  .alma-location-overlay{
  display:none;
  position:fixed;
  inset:0;
  z-index:5000;

  align-items:center;
  justify-content:center;

  padding:20px;
  background:rgba(0,0,0,.42);
}

.alma-location-dialog{
  width:min(92%,420px);
  padding:24px;

  background:#ffffff;
  border-radius:22px;

  box-shadow:
    0 12px 40px rgba(0,0,0,.30);

  text-align:center;
}

.alma-location-dialog h2{
  margin:0 0 12px;
  color:#111827;
  font-size:22px;
}

.alma-location-dialog p{
  margin:0 0 20px;
  color:#4b5563;
  font-size:16px;
  line-height:1.8;
}

.alma-location-actions{
  display:flex;
  gap:10px;
}

.alma-location-actions button{
  flex:1;
  min-height:48px;

  border:0;
  border-radius:14px;

  font-family:inherit;
  font-size:16px;
  font-weight:700;

  cursor:pointer;
}

#allowLocationButton{
  background:#146c43;
  color:#ffffff;
}

#cancelLocationButton{
  background:#e5e7eb;
  color:#111827;
}
  </style>
</head>

<body>

<div class="alma-panel">

  <div class="alma-search-bar">

    <span class="search-icon">⌕</span>

    <input
      id="toInput"
      type="text"
      placeholder="ابحث"
      autocomplete="off"
    >

    <button
      id="microphoneButton"
      class="microphone-button"
      type="button"
      aria-label="الميكروفون"
    >
      🎤
    </button>

  </div>

    <div
    id="searchSuggestions"
    class="search-suggestions"
  ></div>
  <select id="languageSelect">
    <option value="ar">العربية</option>
    <option value="ckb">کوردی</option>
    <option value="en">English</option>
    <option value="tr">Türkçe</option>
    <option value="fa">فارسی</option>
  </select>

  <div id="liveBadge" class="live-badge">
    🛰️ الملاحة الحية تعمل
  </div>

  <div id="status" class="status"></div>

  <div id="routeResult" class="route-result">

    <div class="route-summary">

      <div>
        <strong id="distanceValue">—</strong>
        <span id="distanceLabel">المسافة</span>
      </div>

      <div>
        <strong id="durationValue">—</strong>
        <span id="durationLabel">الوقت التقريبي</span>
      </div>

    </div>

  </div>

  <button
    id="navigationButton"
    class="alma-start-button"
    onclick="startAlmaNavigation()"
     style="display:none;"
  >
    ابدأ
  </button>

  <button
    id="stopButton"
    class="stop-button"
    onclick="stopAllNavigation()"
  >
    ■ إيقاف
  </button>

  <div
    id="navigationBox"
    class="navigation-box"
  >

    <div class="instruction-row">

      <div id="turnIcon">⬆️</div>

      <div>

        <div id="instructionText">
          تابع إلى الأمام
        </div>

        <div id="instructionDistance"></div>

      </div>

    </div>

    <div class="progress-wrap">
      <div id="progressBar"></div>
    </div>

  </div>

</div>

<div id="map"></div>
<div id="navigationMap"></div>
<div id="tripBar" class="trip-bar">

  <div class="trip-stat">
    <strong id="remainingTimeValue">—</strong>
    <span id="remainingTimeLabel">الوقت المتبقي</span>
  </div>

  <div class="trip-stat">
    <strong id="remainingDistanceValue">—</strong>
    <span id="remainingDistanceLabel">المسافة المتبقية</span>
  </div>

  <div class="trip-stat">
    <strong id="arrivalTimeValue">—</strong>
    <span id="arrivalTimeLabel">الوصول</span>
  </div>

</div>
 <div
  id="locationPermissionOverlay"
  class="alma-location-overlay"
>
  <div class="alma-location-dialog">

    <h2 id="locationPermissionTitle">
      السماح بالموقع
    </h2>

    <p id="locationPermissionText">
      يحتاج ALMA إلى موقعك الحالي لبدء الملاحة وتحديد الطريق من مكانك إلى وجهتك.
    </p>

    <div class="alma-location-actions">

      <button
        id="allowLocationButton"
        type="button"
      >
        اسمح بالموقع
      </button>

      <button
        id="cancelLocationButton"
        type="button"
      >
        ليس الآن
      </button>

    </div>

  </div>
</div> 

<script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>

async function requestNavigationWakeLock(){

  navigationWantsWakeLock=true;

  if(!("wakeLock" in navigator)){
    console.warn("Wake Lock غير مدعوم في هذا المتصفح.");
    return;
  }

  try{

    if(
      wakeLock &&
      !wakeLock.released
    ){
      return;
    }

    wakeLock=
      await navigator.wakeLock.request(
        "screen"
      );

    wakeLock.addEventListener(
      "release",
      ()=>{
        wakeLock=null;
      }
    );

  }catch(error){

    console.warn(
      "تعذر إبقاء الشاشة مضيئة:",
      error
    );

  }

}


async function releaseNavigationWakeLock(){

  navigationWantsWakeLock=false;

  if(
    wakeLock &&
    !wakeLock.released
  ){

    try{

      await wakeLock.release();

    }catch(error){

      console.warn(
        "تعذر تحرير Wake Lock:",
        error
      );

    }

  }

  wakeLock=null;

}

  function calculateDistance(pointA,pointB){

  if(
    !pointA ||
    !pointB
  ){
    return Infinity;
  }

  const lat1=
    Number(pointA[0]);

  const lon1=
    Number(pointA[1]);

  const lat2=
    Number(pointB[0]);

  const lon2=
    Number(pointB[1]);

  if(
    !Number.isFinite(lat1) ||
    !Number.isFinite(lon1) ||
    !Number.isFinite(lat2) ||
    !Number.isFinite(lon2)
  ){
    return Infinity;
  }

  const earthRadius=
    6371000;

  const toRadians=
    degrees=>
      degrees*Math.PI/180;

  const dLat=
    toRadians(lat2-lat1);

  const dLon=
    toRadians(lon2-lon1);

  const a=
    Math.sin(dLat/2)*
    Math.sin(dLat/2)+
    Math.cos(toRadians(lat1))*
    Math.cos(toRadians(lat2))*
    Math.sin(dLon/2)*
    Math.sin(dLon/2);

  const c=
    2*Math.atan2(
      Math.sqrt(a),
      Math.sqrt(1-a)
    );

  return earthRadius*c;

}
function calculateBearing(from,to){

  const lat1=from[0]*Math.PI/180;
  const lat2=to[0]*Math.PI/180;

  const deltaLon=
    (to[1]-from[1])*
    Math.PI/180;

  const y=
    Math.sin(deltaLon)*
    Math.cos(lat2);

  const x=
    Math.cos(lat1)*
    Math.sin(lat2)-
    Math.sin(lat1)*
    Math.cos(lat2)*
    Math.cos(deltaLon);

  return(
    Math.atan2(y,x)*
    180/Math.PI+
    360
  )%360;

}

function formatRemainingDistance(
  meters
){

  const t=
    translations[currentLanguage];

  if(
    !Number.isFinite(meters)
  ){
    return "—";
  }

  if(meters<1000){

    let rounded;

    if(meters<100){

      rounded=
        Math.max(
          10,
          Math.round(
            meters/10
          )*10
        );

    }else{

      rounded=
        Math.round(
          meters/50
        )*50;

    }

    return(
      rounded+
      " "+
      t.meter
    );

  }

  return(
    (
      meters/1000
    ).toFixed(
      meters<10000 ? 1 : 0
    )+
    " "+
    t.km
  );

}


function formatArrivalTime(
  seconds
){

  if(
    !Number.isFinite(seconds)
  ){
    return "—";
  }

  const date=
    new Date(
      Date.now()+
      Math.max(
        0,
        seconds
      )*1000
    );

  try{

    return new Intl.DateTimeFormat(

      currentLanguage==="ckb"
        ? "ckb-IQ"
        : currentLanguage==="ar"
        ? "ar-IQ"
        : currentLanguage==="fa"
        ? "fa-IR"
        : currentLanguage==="tr"
        ? "tr-TR"
        : "en-US",

      {
        hour:"numeric",
        minute:"2-digit"
      }

    ).format(date);

  }catch(error){

    return date.toLocaleTimeString(
      [],
      {
        hour:"2-digit",
        minute:"2-digit"
      }
    );

  }

}


function nearestRouteIndex(
  position
){

  if(
    !routeCoordinates.length
  ){
    return 0;
  }

  let best=0;
  let bestDistance=Infinity;

  const jump=
    Math.max(
      1,
      Math.floor(
        routeCoordinates.length/900
      )
    );

  for(
    let i=0;
    i<routeCoordinates.length;
    i+=jump
  ){

    const distance=
  calculateDistance(
    position,
    routeCoordinates[i]
  );
    if(
      distance<
      bestDistance
    ){

      bestDistance=distance;
      best=i;

    }

  }

  const start=
    Math.max(
      0,
      best-jump
    );

  const end=
    Math.min(
      routeCoordinates.length-1,
      best+jump
    );

  for(
    let i=start;
    i<=end;
    i++
  ){

    const distance=
  calculateDistance(
    position,
    routeCoordinates[i]
  );

    if(
      distance<
      bestDistance
    ){

      bestDistance=distance;
      best=i;

    }

  }

  return best;

}


function updateTripMetrics(
  position,
  knownIndex=null
){

  if(
    !currentRoute ||
    !routeCoordinates.length
  ){
    return;
  }

  const index=
    knownIndex===null
      ? nearestRouteIndex(position)
      : knownIndex;

  const ratio=
    Math.max(
      0,
      Math.min(
        1,
        index/
        Math.max(
          1,
          routeCoordinates.length-1
        )
      )
    );

  const remainingDistance=
    currentRoute.distance*
    (1-ratio);

  const remainingSeconds=
    currentRoute.duration*
    (1-ratio);

  document.getElementById(
    "remainingTimeValue"
  ).textContent=
    formatDuration(
      Math.max(
        1,
        Math.ceil(
          remainingSeconds/60
        )
      )
    );

  document.getElementById(
    "remainingDistanceValue"
  ).textContent=
    formatRemainingDistance(
      remainingDistance
    );

  document.getElementById(
    "arrivalTimeValue"
  ).textContent=
    formatArrivalTime(
      remainingSeconds
    );

}

    return null;
  }

  const target=
    speechLanguages[language] ||
    language;

  const base=
    target
    .split("-")[0]
    .toLowerCase();

  const candidates=
    availableVoices.filter(
      voice=>
        voice.lang &&
        voice.lang
        .toLowerCase()
        .startsWith(base)
    );

  if(!candidates.length){
    return null;
  }

  /*
    نعطي أولوية للأصوات المحلية عالية الجودة،
    ثم للصوت المطابق للمنطقة،
    ثم لأي صوت من اللغة نفسها.
  */

  const preferredNames=
    language==="en"
      ? [
          "Google US English",
          "Microsoft Aria",
          "Microsoft Jenny",
          "Samantha",
          "Google UK English Female"
        ]
      : language==="ar"
      ? [
          "Google العربية",
          "Microsoft Hamed",
          "Microsoft Naayf",
          "Maged",
          "Tarik"
        ]
      : [];

  for(
    const preferredName
    of preferredNames
  ){

    const preferred=
      candidates.find(
        voice=>
          voice.name
          .toLowerCase()
          .includes(
            preferredName.toLowerCase()
          )
      );

    if(preferred){
      return preferred;
    }

  }

  const exact=
    candidates.find(
      voice=>
        voice.lang
        .toLowerCase()===
        target.toLowerCase()
    );

  if(exact){
    return exact;
  }

  const local=
    candidates.find(
      voice=>voice.localService
    );

  if(local){
    return local;
  }

  return candidates[0];

}

function prepareTextForSpeech(text){

  if(
    currentLanguage!=="ar" ||
    !text
  ){
    return text;
  }

  let speechText=text;

  /*
    جمل الملاحة العربية المضبوطة للنطق.
    روعي فيها الوقف بالسكون عندما تنتهي
    العبارة عند هذه الكلمة.
  */

  const spokenPhrases=[

    [
      "لقد وصلت إلى وجهتك",
      "لَقَدْ وَصَلْتَ إِلَى وِجْهَتِكْ"
    ],

    [
      "تابع إلى الأمام",
      "تَابِعْ إِلَى الْأَمَامْ"
    ],

    [
      "انعطف يميناً",
      "اِنْعَطِفْ يَمِينًا"
    ],

    [
      "انعطف يمينًا",
      "اِنْعَطِفْ يَمِينًا"
    ],

    [
      "انعطف يساراً",
      "اِنْعَطِفْ يَسَارًا"
    ],

    [
      "انعطف يسارًا",
      "اِنْعَطِفْ يَسَارًا"
    ],

    [
      "اتجه قليلاً إلى اليمين",
      "اِتَّجِهْ قَلِيلًا إِلَى الْيَمِينْ"
    ],

    [
      "اتجه قليلاً إلى اليسار",
      "اِتَّجِهْ قَلِيلًا إِلَى الْيَسَارْ"
    ],

    [
      "انعطف بشدة إلى اليمين",
      "اِنْعَطِفْ بِشِدَّةٍ إِلَى الْيَمِينْ"
    ],

    [
      "انعطف بشدة إلى اليسار",
      "اِنْعَطِفْ بِشِدَّةٍ إِلَى الْيَسَارْ"
    ],

    [
      "قم بالاستدارة",
      "قُمْ بِالِاسْتِدَارَةْ"
    ],

    [
      "ادخل الدوار",
      "اُدْخُلِ الدَّوَّارْ"
    ],

    [
      "خذ المَخْرَج رقم",
      "خُذِ الْمَخْرَجَ رَقْمَ"
    ],

    [
      "خذ المخرج رقم",
      "خُذِ الْمَخْرَجَ رَقْمَ"
    ],

    [
      "ثم بعد مسافة قصيرة",
      "ثُمَّ بَعْدَ مَسَافَةٍ قَصِيرَةٍ"
    ],

    [
      "الآن",
      "الْآنْ"
    ]

  ];

  spokenPhrases.forEach(
    ([written,spoken])=>{

      speechText=
        speechText.replaceAll(
          written,
          spoken
        );

    }
  );

  /*
    بعض الكلمات التي تدخل في الجملة المركبة.
  */

  speechText=
    speechText.replace(
      /بعد (?=\d)/g,
      "بَعْدَ "
    );

  /*
    عند نهاية الكلام فقط نحذف حركة الإعراب
    النهائية إن وجدت، لأن القارئ يقف.
    لا نمس التشكيل الداخلي للكلمة.
  */

  speechText=
    speechText.replace(
      /[\u064B-\u0652]+(?=\s*$)/,
      ""
    );

  return speechText;

}
  
function speakNavigation(
  text,
  stepIndex,
  force=false
){

  if(!voiceEnabled){
    return;
  }

  if(!("speechSynthesis" in window)){
    return;
  }

  if(
    !force &&
    stepIndex===lastSpokenStep &&
    text===lastSpokenText
  ){
    return;
  }

 const speechText=
  prepareTextForSpeech(text);

const utterance=
  new SpeechSynthesisUtterance(
    speechText
  );

utterance.lang=
  speechLanguages[currentLanguage] ||
  currentLanguage;
  const voice=
    findVoice(currentLanguage);

  if(voice){
    utterance.voice=voice;
  }

  if(currentLanguage==="ar"){

  utterance.rate=0.92;
  utterance.pitch=1;

}else if(currentLanguage==="en"){

  utterance.rate=0.96;
  utterance.pitch=1;

}else{

  utterance.rate=0.95;
  utterance.pitch=1;

}

utterance.volume=1;

  window.speechSynthesis.cancel();
  window.speechSynthesis.speak(utterance);

  lastSpokenStep=stepIndex;
  lastSpokenText=text;

}


function stopSpeech(){

  if("speechSynthesis" in window){
    window.speechSynthesis.cancel();
  }

}

async function searchPlaceSuggestions(query){

    "&limit=6"+
    "&countrycodes=iq"+
    "&addressdetails=1"+
    "&accept-language="+

async function requestRoute(
  start,
  destination
){

  const routeURL=
    "https://router.project-osrm.org/route/v1/driving/"+
    start.lon+","+
    start.lat+";"+
    destination.lon+","+
    destination.lat+
    "?overview=full&geometries=geojson&steps=true";

  console.log(
    "ALMA route start:",
    start
  );

  console.log(
    "ALMA route destination:",
    destination
  );

  console.log(
    "ALMA route URL:",
    routeURL
  );

  let response;

  try{

    response=
      await fetch(routeURL);

  }catch(error){

    console.error(
      "ALMA OSRM fetch failed:",
      error
    );

    throw new Error(
      "OSRM_FETCH_FAILED"
    );

  }

  console.log(
    "ALMA OSRM HTTP status:",
    response.status
  );

  let data;

  try{

    data=
      await response.json();

  }catch(error){

    console.error(
      "ALMA OSRM invalid response:",
      error
    );

    throw new Error(
      "OSRM_INVALID_RESPONSE"
    );

  }

  console.log(
    "ALMA OSRM response:",
    data
  );

    if(!response.ok){

    console.error(
      "ALMA OSRM HTTP error:",
      response.status,
      data
    );

    throw new Error(
      "OSRM_HTTP_"+
      response.status+
      " | "+
      (
        data && data.code
          ? data.code
          : "NO_CODE"
      )+
      " | "+
      (
        data && data.message
          ? data.message
          : "NO_MESSAGE"
      )
    );

  }

  if(
    data.code!=="Ok" ||
    !data.routes ||
    !data.routes.length
  ){

    throw new Error(
      "OSRM_"+
      (data.code || "NO_ROUTE")
    );

  }

  return data.routes[0];

}

function prepareRoute(route){

  currentStepIndex=0;

  resetSpokenInstruction();

  currentRoute=route;

  routeCoordinates=
    route.geometry.coordinates.map(
      coordinate=>[
        coordinate[1],
        coordinate[0]
      ]
    );

  routeSteps=[];

  route.legs.forEach(
    leg=>{

      leg.steps.forEach(
        step=>{
          routeSteps.push(step);
        }
      );

    }
  );

}

function drawRoute(){

  initializeNavigationMap();

  if(
    !navigationMap ||
    !routeCoordinates.length
  ){
    return;
  }

  const routeGeoJSON={
    type:"Feature",
    properties:{},
    geometry:{
      type:"LineString",

      coordinates:
        routeCoordinates.map(
          coordinate=>[
            coordinate[1],
            coordinate[0]
          ]
        )
    }
  };


  function updateMapLibreRoute(){

    if(
      navigationMap.getSource(
        "alma-route"
      )
    ){

      navigationMap
      .getSource("alma-route")
      .setData(routeGeoJSON);

      return;
    }


    navigationMap.addSource(
      "alma-route",
      {
        type:"geojson",
        data:routeGeoJSON
      }
    );


    navigationMap.addLayer({

      id:"alma-route-casing",

      type:"line",

      source:"alma-route",

      layout:{
        "line-cap":"round",
        "line-join":"round"
      },

      paint:{
        "line-color":"#ffffff",
        "line-width":16,
        "line-opacity":0.96
      }

    });


    navigationMap.addLayer({

      id:"alma-route-line",

      type:"line",

      source:"alma-route",

      layout:{
        "line-cap":"round",
        "line-join":"round"
      },

      paint:{
        "line-color":"#3478f6",
        "line-width":10,
        "line-opacity":1
      }

    });

  }


  if(navigationMap.loaded()){

    updateMapLibreRoute();

  }else{

    navigationMap.once(
      "load",
      updateMapLibreRoute
    );

  }

}

        };

          )+

              : "null"
          )+

          )
        );

      }

    },

    error=>{

      );

      let message="";

function startLiveNavigation(){

    translations[currentLanguage];

  if(
    !destinationCoordinates ||
    !startCoordinates
  ){

    alert(t.enterPlaces);
    return;

  }

  if(!navigator.geolocation){

    alert(t.locationError);
    return;

  }

  showStatus(t.waitingGPS);

  navigator.geolocation.getCurrentPosition(

    function(position){

      const realPosition=[
        position.coords.latitude,
        position.coords.longitude
      ];

      const routeStart=[
        startCoordinates.lat,
        startCoordinates.lon
      ];

     const distanceFromStart=
  calculateDistance(
    realPosition,
    routeStart
  );

      if(
        distanceFromStart>
        MAX_START_DISTANCE
      ){

        hideStatus();
        alert(t.farFromStart);
        return;

      }

  if(gpsWatchId!==null){

  navigator.geolocation.clearWatch(
    gpsWatchId
  );

  gpsWatchId=null;

}

previousLivePosition=null;

      liveNavigation=true;

      requestNavigationWakeLock();

      currentStepIndex=0;

      resetSpokenInstruction();

      const liveBadge=
        document.getElementById(
          "liveBadge"
        );

      const navigationBox=
        document.getElementById(
          "navigationBox"
        );

      const navigationButton=
        document.getElementById(
          "navigationButton"
        );

      const stopButton=
        document.getElementById(
          "stopButton"
        );

      if(liveBadge){
        liveBadge.style.display="block";
      }

      if(navigationBox){
        navigationBox.style.display="block";
      }

      if(navigationButton){
        navigationButton.style.display="none";
      }

      if(stopButton){
        stopButton.style.display="block";
      }

      enterMobileNavigationMode();

      handleLivePosition(position);

      gpsWatchId=
        navigator.geolocation.watchPosition(

          handleLivePosition,

          handleLiveLocationError,

          {
            enableHighAccuracy:true,
            maximumAge:1000,
            timeout:15000
          }

        );

    },

    function(){

      hideStatus();

      alert(t.locationError);

    },

    {
      enableHighAccuracy:true,

    }

  );

}

  let navigationBearing=

if(

async function recalculateFromCurrentPosition(
  lat,
  lon
){

  if(!destinationCoordinates){
    return;
  }

  const t=
    translations[currentLanguage];

  showStatus(
    t.recalculating
  );

  try{

    const newRoute=
      await requestRoute(
        {
          lat,
          lon
        },
        destinationCoordinates
      );

    startCoordinates={
      lat:lat,
      lon:lon,
      name:t.currentLocation
    };

    prepareRoute(newRoute);
    drawRoute();
    updateRouteSummary();

    hideStatus();

  }catch(error){

    console.error(error);
    hideStatus();

  }

}


function distanceFromRoute(point){

  if(!routeCoordinates.length){
    return Infinity;
  }

  let minimum=
    Infinity;

  const jump=
    Math.max(
      1,
      Math.floor(
        routeCoordinates.length/700
      )
    );

  for(
    let i=0;
    i<routeCoordinates.length;
    i+=jump
  ){

    const distance=
  calculateDistance(
    point,
    routeCoordinates[i]
  );

    if(distance<minimum){
      minimum=distance;
    }

  }

  return minimum;

}

function updateInstruction(position){

  if(!routeSteps.length){
    return;
  }

  if(
    currentStepIndex>=
    routeSteps.length
  ){

    currentStepIndex=
      routeSteps.length-1;

  }

  let bestIndex=
    currentStepIndex;

  let bestDistance=
    Infinity;

  const searchEnd=
    Math.min(
      routeSteps.length,
      currentStepIndex+5
    );

  for(
    let i=currentStepIndex;
    i<searchEnd;
    i++
  ){

    const maneuver=
      routeSteps[i].maneuver;

    if(
      !maneuver ||
      !maneuver.location
    ){
      continue;
    }

    const point=[
      maneuver.location[1],
      maneuver.location[0]
    ];

   const distance=
  calculateDistance(
    position,
    point
  );

    if(
      distance<
      bestDistance
    ){

      bestDistance=distance;
      bestIndex=i;

    }

  }

  if(
    bestIndex>
    currentStepIndex
  ){

    currentStepIndex=
      bestIndex;

  }

  let step=
    routeSteps[
      currentStepIndex
    ];

  if(
    !step ||
    !step.maneuver ||
    !step.maneuver.location
  ){
    return;
  }

  let maneuverPoint=[
    step.maneuver.location[1],
    step.maneuver.location[0]
  ];

 let distanceToManeuver=
  calculateDistance(
    position,
    maneuverPoint
  );

  if(
    distanceToManeuver<30 &&
    currentStepIndex<
    routeSteps.length-1
  ){

    currentStepIndex++;

    step=
      routeSteps[
        currentStepIndex
      ];

    if(
      step &&
      step.maneuver &&
      step.maneuver.location
    ){

      maneuverPoint=[
        step.maneuver.location[1],
        step.maneuver.location[0]
      ];
distanceToManeuver=
  calculateDistance(
    position,
    maneuverPoint
  );
    }

  }

  const instruction=
    buildNavigationInstruction(
      step
    );

  document.getElementById("turnIcon")
  .textContent=
    instruction.icon;

  document.getElementById("instructionText")
  .textContent=
    instruction.text;

  document.getElementById("instructionDistance")
  .textContent=
    formatNavigationDistance(
      distanceToManeuver
    );

  handleSmartVoiceGuidance(
    step,
    distanceToManeuver
  );

}


function isImportantManeuver(step){

  if(
    !step ||
    !step.maneuver
  ){
    return false;
  }

  const type=
    step.maneuver.type || "";

  const modifier=
    step.maneuver.modifier || "";

  if(type==="arrive"){
    return true;
  }

  if(
    type==="roundabout" ||
    type==="rotary" ||
    type==="roundabout turn"
  ){
    return true;
  }

  return[
    "right",
    "left",
    "slight right",
    "slight left",
    "sharp right",
    "sharp left",
    "uturn"
  ].includes(modifier);

}


function maneuverDistanceBetween(
  stepA,
  stepB
){

  if(
    !stepA ||
    !stepB ||
    !stepA.maneuver ||
    !stepB.maneuver ||
    !stepA.maneuver.location ||
    !stepB.maneuver.location
  ){
    return Infinity;
  }

  return calculateDistance(

  [
    stepA.maneuver.location[1],
    stepA.maneuver.location[0]
  ],

  [
    stepB.maneuver.location[1],
    stepB.maneuver.location[0]
  ]

);

}


function getNextImportantStep(index){

  for(
    let i=index+1;
    i<routeSteps.length;
    i++
  ){

    if(
      isImportantManeuver(
        routeSteps[i]
      )
    ){

      return{
        step:routeSteps[i],
        index:i
      };

    }

  }

  return null;

}

  if(meters<=55){

      targetIndex
    ].now=true;

  }

  );

function handleSmartVoiceGuidance(
  step,
  meters
){

  if(
    !voiceEnabled ||
    !isImportantManeuver(step)
  ){
    return;
  }

  const type=
    step.maneuver?.type || "";

  if(type==="arrive"){

    if(
      !spokenStages[
        currentStepIndex
      ]?.arrive
    ){

      spokenStages[
        currentStepIndex
      ]={
        ...(
          spokenStages[
            currentStepIndex
          ] || {}
        ),
        arrive:true
      };

      speakNavigation(
        translations[
          currentLanguage
        ].arrive,
        currentStepIndex,
        true
      );

    }

    return;

  }

  let stage=null;

  if(
    meters>450 &&
    meters<=900
  ){

    stage="early";

  }else if(
    meters>120 &&
    meters<=260
  ){

    stage="near";

  }else if(
    meters<=55
  ){

    stage="now";

  }else{

    return;

  }

  const state=
    spokenStages[
      currentStepIndex
    ] || {};

  if(state[stage]){
    return;
  }

  const nowTime=
    Date.now();

  if(
    nowTime-lastVoiceTime <
    VOICE_COOLDOWN &&
    stage!=="now"
  ){
    return;
  }

  const instruction=
    buildNavigationInstruction(
      step
    );

  let spokenText="";

  if(stage==="now"){

    spokenText=
      instruction.text+
      "، "+
      translations[
        currentLanguage
      ].now;

  }else{

    spokenText=
      buildSpokenInstruction(
        instruction.text,
        meters
      );

  }

  const next=
    getNextImportantStep(
      currentStepIndex
    );

  if(
    next &&
    maneuverDistanceBetween(
      step,
      next.step
    )<=CLOSE_MANEUVER_DISTANCE
  ){

    const nextInstruction=
      buildNavigationInstruction(
        next.step
      );

    spokenText+=
      "، "+
      translations[
        currentLanguage
      ].thenShort+
      "، "+
      nextInstruction.text;

    spokenStages[
      next.index
    ]={
      ...(
        spokenStages[
          next.index
        ] || {}
      ),
      early:true,
      near:true
    };

  }

  spokenStages[
    currentStepIndex
  ]={
    ...state,
    [stage]:true
  };

  lastVoiceTime=
    nowTime;

  speakNavigation(
    spokenText,
    currentStepIndex,
    true
  );

}


function buildSpokenInstruction(
  instructionText,
  meters
){

  const t=
    translations[
      currentLanguage
    ];

  if(
    !Number.isFinite(meters) ||
    meters<40
  ){

    return instructionText;

  }

  let distanceText;

  if(meters<1000){

    let rounded;

    if(meters<100){

      rounded=
        Math.max(
          10,
          Math.round(
            meters/10
          )*10
        );

    }else{

      rounded=
        Math.round(
          meters/50
        )*50;

    }

    distanceText=
      rounded+
      " "+
      t.meter;

  }else{

    distanceText=
      (
        meters/1000
      ).toFixed(1)+
      " "+
      t.km;

  }

  return(
    t.after+
    " "+
    distanceText+
    "، "+
    instructionText
  );

}


function buildNavigationInstruction(step){

  const t=
    translations[
      currentLanguage
    ];

  const maneuver=
    step.maneuver || {};

  const modifier=
    maneuver.modifier || "";

  const type=
    maneuver.type || "";

  const roadName=
    (step.name || "")
    .trim();

  let icon="⬆️";
  let text=t.straight;

  if(type==="arrive"){

    return{
      icon:"🏁",
      text:t.arrive
    };

  }

  if(
    type==="roundabout" ||
    type==="rotary" ||
    type==="roundabout turn"
  ){

    icon="↻";
    text=t.roundabout;

    if(maneuver.exit){

      text+=
        " — "+
        t.exit+
        " "+
        maneuver.exit;

    }

    if(roadName){

      text+=
        " "+
        t.onto+
        " "+
        roadName;

    }

    return{
      icon,
      text
    };

  }

  if(modifier==="right"){

    icon="➡️";
    text=t.right;

  }else if(
    modifier==="left"
  ){

    icon="⬅️";
    text=t.left;

  }else if(
    modifier==="slight right"
  ){

    icon="↗️";
    text=t.slightRight;

  }else if(
    modifier==="slight left"
  ){

    icon="↖️";
    text=t.slightLeft;

  }else if(
    modifier==="sharp right"
  ){

    icon="⤵️";
    text=t.sharpRight;

  }else if(
    modifier==="sharp left"
  ){

    icon="⤴️";
    text=t.sharpLeft;

  }else if(
    modifier==="uturn"
  ){

    icon="↩️";
    text=t.uturn;

  }else{

    icon="⬆️";
    text=t.straight;

  }

  if(
    roadName &&
    type!=="arrive"
  ){

    text+=
      " "+
      t.onto+
      " "+
      roadName;

  }

  return{
    icon,
    text
  };

}


function formatNavigationDistance(
  meters
){

  const t=
    translations[
      currentLanguage
    ];

  if(
    !Number.isFinite(meters)
  ){
    return "";
  }

  if(meters<1000){

    let rounded;

    if(meters<100){

      rounded=
        Math.max(
          10,
          Math.round(
            meters/10
          )*10
        );

    }else{

      rounded=
        Math.round(
          meters/50
        )*50;

    }

    return(
      t.after+
      " "+
      rounded+
      " "+
      t.meter
    );

  }

  return(
    t.after+
    " "+
    (
      meters/1000
    ).toFixed(1)+
    " "+
    t.km
  );

}

    "navigationButton"
  );

if(navigationButton){
  navigationButton.style.display=
    "block";
}

}


function stopAllNavigation(
  hideNavigation=true
){

  

  if(gpsWatchId!==null){

    navigator.geolocation.clearWatch(
      gpsWatchId
    );

    gpsWatchId=null;

  }

  liveNavigation=false;

  releaseNavigationWakeLock();

  leaveMobileNavigationMode();

  stopSpeech();

  resetSpokenInstruction();

  const liveBadge=
    document.getElementById(
      "liveBadge"
    );

  const stopButton=
    document.getElementById(
      "stopButton"
    );

  const navigationButton=
    document.getElementById(
      "navigationButton"
    );

  const navigationBox=
    document.getElementById(
      "navigationBox"
    );

  if(liveBadge){
    liveBadge.style.display="none";
  }

  if(stopButton){
    stopButton.style.display="none";
  }

  if(navigationCarMarker){

    navigationCarMarker.remove();

    navigationCarMarker=null;

  }
  const navigationMapContainer=
  document.getElementById(
    "navigationMap"
  );

const normalMapContainer=
  document.getElementById(
    "map"
  );

if(navigationMapContainer){
  navigationMapContainer.style.display=
    "none";
}

if(normalMapContainer){
  normalMapContainer.style.display=
    "block";
}

if(map){
  setTimeout(()=>{
  map.resize();
  },100);
}

  if(
    currentRoute &&
    navigationButton
  ){

    navigationButton.style.display=
      "block";

  }

  if(
    hideNavigation &&
    navigationBox
  ){

    navigationBox.style.display=
      "none";

  }

  const progressBar=
    document.getElementById(
      "progressBar"
    );

  if(progressBar){
    progressBar.style.width="0%";
  }

  document.getElementById(
    "remainingTimeValue"
  ).textContent="—";

  document.getElementById(
    "remainingDistanceValue"
  ).textContent="—";

  document.getElementById(
    "arrivalTimeValue"
  ).textContent="—";

  previousLivePosition=null;

  hideStatus();

}

function formatDuration(minutes){

  const t=
    translations[
      currentLanguage
    ];

  if(minutes<60){

    return(
      minutes+
      " "+
      t.min
    );

  }

  const hours=
    Math.floor(
      minutes/60
    );

  const remaining=
    minutes%60;

  if(!remaining){

    return(
      hours+
      " "+
      t.hour
    );

  }

  return(
    hours+
    " "+
    t.hour+
    " "+
    remaining+
    " "+
    t.min
  );

}

document
.getElementById("languageSelect")
.addEventListener(
  "change",
  function(){

    setLanguage(
      this.value
    );

  }
);

document
.getElementById("toInput")
.addEventListener(
  "keydown",
  function(event){

    if(
      event.key!=="Enter"
    ){
      return;
    }

    event.preventDefault();

    if(
      destinationCoordinates &&
      Number.isFinite(
        Number(
          destinationCoordinates.lat
        )
      ) &&
      Number.isFinite(
        Number(
          destinationCoordinates.lon
        )
      )
    ){

      startAlmaNavigation();

    }

  }
);

window.addEventListener(
  "resize",
  function(){

    if(liveNavigation){

      enterMobileNavigationMode();

    }else{

      leaveMobileNavigationMode();

    }

  }
);
