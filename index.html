<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ALMA Maps | خرائط ألما</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      font-family: Arial, sans-serif;
    }

    #map {
      width: 100%;
      height: 100vh;
    }

    .alma-panel {
      position: absolute;
      top: 18px;
      right: 18px;
      z-index: 1000;
      width: min(420px, calc(100% - 36px));
      background: rgba(255,255,255,.97);
      border-radius: 20px;
      padding: 16px;
      box-shadow: 0 7px 30px rgba(0,0,0,.20);
      max-height: calc(100vh - 36px);
      overflow-y: auto;
    }

    html[dir="ltr"] .alma-panel {
      right: auto;
      left: 18px;
    }

    .top-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 15px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo {
      width: 46px;
      height: 46px;
      border-radius: 13px;
      background: #146c43;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 20px;
    }

    .brand h1 {
      margin: 0;
      font-size: 22px;
      color: #1f2937;
    }

    .brand p {
      margin: 3px 0 0;
      color: #6b7280;
      font-size: 12px;
    }

    #languageSelect {
      border: 1px solid #d1d5db;
      border-radius: 10px;
      padding: 8px;
      background: white;
      max-width: 105px;
    }

    .route-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 9px;
    }

    .route-icon {
      width: 28px;
      text-align: center;
      font-size: 18px;
    }

    .route-row input {
      flex: 1;
      min-width: 0;
      border: 1px solid #d1d5db;
      border-radius: 11px;
      padding: 12px;
      font-size: 15px;
      outline: none;
    }

    .route-row input:focus {
      border-color: #146c43;
    }

    .my-location {
      margin: 2px 36px 12px 0;
      border: 0;
      background: transparent;
      color: #146c43;
      font-size: 13px;
      cursor: pointer;
      padding: 0;
    }

    html[dir="ltr"] .my-location {
      margin: 2px 0 12px 36px;
    }

    .main-button {
      width: 100%;
      border: 0;
      border-radius: 11px;
      padding: 13px;
      background: #146c43;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .main-button:disabled {
      opacity: .6;
      cursor: wait;
    }

    .route-result {
      display: none;
      margin-top: 12px;
      background: #f3f4f6;
      border-radius: 12px;
      padding: 12px;
    }

    .route-summary {
      display: flex;
      justify-content: space-around;
      text-align: center;
      gap: 10px;
    }

    .route-summary strong {
      display: block;
      font-size: 18px;
      margin-bottom: 3px;
    }

    .route-summary span {
      color: #6b7280;
      font-size: 12px;
    }

    .preview-button {
      display: none;
      width: 100%;
      margin-top: 10px;
      border: 0;
      border-radius: 11px;
      padding: 13px;
      background: #2563eb;
      color: white;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    .stop-button {
      display: none;
      width: 100%;
      margin-top: 8px;
      border: 0;
      border-radius: 11px;
      padding: 11px;
      background: #e5e7eb;
      color: #111827;
      font-size: 14px;
      cursor: pointer;
    }

    .navigation-box {
      display: none;
      margin-top: 12px;
      border-radius: 14px;
      padding: 14px;
      background: #146c43;
      color: white;
    }

    .instruction-row {
      display: flex;
      align-items: center;
      gap: 13px;
    }

    #turnIcon {
      font-size: 34px;
      min-width: 45px;
      text-align: center;
    }

    #instructionText {
      font-size: 18px;
      font-weight: bold;
      line-height: 1.5;
    }

    #instructionDistance {
      margin-top: 5px;
      font-size: 13px;
      opacity: .9;
    }

    .progress-wrap {
      margin-top: 12px;
      height: 6px;
      background: rgba(255,255,255,.3);
      border-radius: 10px;
      overflow: hidden;
    }

    #progressBar {
      width: 0%;
      height: 100%;
      background: white;
      border-radius: 10px;
    }

    .status {
      display: none;
      margin-top: 10px;
      text-align: center;
      font-size: 13px;
      color: #4b5563;
    }

    .car-icon {
      font-size: 28px;
      line-height: 28px;
      text-align: center;
      filter: drop-shadow(0 2px 2px rgba(0,0,0,.35));
    }

    @media (max-width: 600px) {
      .alma-panel {
        top: 8px;
        right: 8px;
        width: calc(100% - 16px);
        max-height: 55vh;
      }

      html[dir="ltr"] .alma-panel {
        left: 8px;
        right: auto;
      }
    }
  </style>
</head>

</div>

const directions = {
  ar: "rtl",
  ku: "rtl",
  en: "ltr",
  tr: "ltr",
  fa: "rtl"
};

let currentLanguage = "ar";

let currentLocationCoordinates = null;

let startMarker = null;
let destinationMarker = null;
let routeLine = null;
let carMarker = null;

let currentRoute = null;
let routeCoordinates = [];
let routeSteps = [];

let previewTimer = null;
let previewIndex = 0;


const map = L.map("map").setView(
  [33.2232, 43.6793],
  6
);

L.tileLayer(
  "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
  {
    maxZoom: 19,
    attribution: "&copy; OpenStreetMap contributors"
  }
).addTo(map);


const carIcon = L.divIcon({
  className: "",
  html: '<div class="car-icon">🚗</div>',
  iconSize: [34,34],
  iconAnchor: [17,17]
});


function setLanguage(language) {

  currentLanguage = language;

  const t = translations[language];

  document.documentElement.lang = language;
  document.documentElement.dir = directions[language];

  document.getElementById("subtitle").textContent =
    t.subtitle;

  document.getElementById("fromInput").placeholder =
    t.from;

  document.getElementById("toInput").placeholder =
    t.to;

  document.getElementById("myLocationButton").textContent =
    t.myLocation;

  document.getElementById("routeButton").textContent =
    t.route;

  document.getElementById("previewButton").textContent =
    t.preview;

  document.getElementById("stopButton").textContent =
    t.stop;

  document.getElementById("distanceLabel").textContent =
    t.distance;

  document.getElementById("durationLabel").textContent =
    t.duration;

  localStorage.setItem("almaLanguage", language);

  setTimeout(function() {
    map.invalidateSize();
  }, 100);
}


function showStatus(message) {

  const status =
    document.getElementById("status");

  status.textContent = message;
  status.style.display = "block";
}


function hideStatus() {

  document.getElementById("status").style.display =
    "none";
}


async function geocodePlace(query) {

  const url =
    "https://nominatim.openstreetmap.org/search" +
    "?format=json" +
    "&limit=1" +
    "&countrycodes=iq" +
    "&accept-language=" +
    encodeURIComponent(currentLanguage) +
    "&q=" +
    encodeURIComponent(query);

  const response = await fetch(url);

  if (!response.ok) {
    throw new Error("Geocoding error");
  }

  const data = await response.json();

  if (!data.length) {
    return null;
  }

  return {
    lat: Number(data[0].lat),
    lon: Number(data[0].lon),
    name: data[0].display_name
  };
}


function useMyLocation() {

  const t = translations[currentLanguage];

  if (!navigator.geolocation) {
    alert(t.locationError);
    return;
  }

  showStatus(t.locating);

  navigator.geolocation.getCurrentPosition(

    function(position) {

      currentLocationCoordinates = {
        lat: position.coords.latitude,
        lon: position.coords.longitude
      };

      document.getElementById("fromInput").value =
        t.currentLocation;

      hideStatus();

      showStatus(t.locationReady);

      setTimeout(hideStatus, 1500);

      map.setView(
        [
          currentLocationCoordinates.lat,
          currentLocationCoordinates.lon
        ],
        16
      );
    },

    function() {
      hideStatus();
      alert(t.locationError);
    },

    {
      enableHighAccuracy: true
    }
  );
}


async function calculateRoute() {

  stopPreview();

  const t = translations[currentLanguage];

  const fromText =
    document.getElementById("fromInput").value.trim();

  const toText =
    document.getElementById("toInput").value.trim();

  if (!fromText || !toText) {
    alert(t.enterPlaces);
    return;
  }

  const button =
    document.getElementById("routeButton");

  button.disabled = true;

  document.getElementById("routeResult").style.display =
    "none";

  document.getElementById("previewButton").style.display =
    "none";

  try {

    showStatus(t.searching);

    let start;

    if (
      currentLocationCoordinates &&
      fromText === t.currentLocation
    ) {

      start = {
        lat: currentLocationCoordinates.lat,
        lon: currentLocationCoordinates.lon,
        name: t.currentLocation
      };

    } else {

      start = await geocodePlace(fromText);
    }

    const destination =
      await geocodePlace(toText);

    if (!start || !destination) {

      hideStatus();
      alert(t.notFound);
      return;
    }

    showStatus(t.calculating);

    const routeURL =
      "https://router.project-osrm.org/route/v1/driving/" +
      start.lon + "," + start.lat + ";" +
      destination.lon + "," + destination.lat +
      "?overview=full&geometries=geojson&steps=true";

    const response =
      await fetch(routeURL);

    if (!response.ok) {
      throw new Error("Routing error");
    }

    const routeData =
      await response.json();

    if (
      routeData.code !== "Ok" ||
      !routeData.routes ||
      !routeData.routes.length
    ) {
      throw new Error("No route");
    }

    currentRoute = routeData.routes[0];

    routeCoordinates =
      currentRoute.geometry.coordinates.map(
        function(coordinate) {
          return [
            coordinate[1],
            coordinate[0]
          ];
        }
      );

    routeSteps = [];

    currentRoute.legs.forEach(function(leg) {

      leg.steps.forEach(function(step) {

        routeSteps.push(step);

      });

    });

    if (routeLine) {
      map.removeLayer(routeLine);
    }

    if (startMarker) {
      map.removeLayer(startMarker);
    }

    if (destinationMarker) {
      map.removeLayer(destinationMarker);
    }

    if (carMarker) {
      map.removeLayer(carMarker);
      carMarker = null;
    }

    routeLine =
      L.polyline(
        routeCoordinates,
        {
          weight: 6,
          opacity: .85
        }
      ).addTo(map);

    startMarker =
      L.marker([start.lat, start.lon])
      .addTo(map)
      .bindPopup(start.name);

    destinationMarker =
      L.marker([destination.lat, destination.lon])
      .addTo(map)
      .bindPopup(destination.name);

    map.fitBounds(
      routeLine.getBounds(),
      {
        padding: [45,45]
      }
    );

    const distanceKm =
      currentRoute.distance / 1000;

    const durationMinutes =
      Math.round(currentRoute.duration / 60);

    document.getElementById(
      "distanceValue"
    ).textContent =
      distanceKm.toFixed(1) +
      " " +
      t.km;

    document.getElementById(
      "durationValue"
    ).textContent =
      formatDuration(durationMinutes);

    document.getElementById(
      "routeResult"
    ).style.display =
      "block";

    document.getElementById(
      "previewButton"
    ).style.display =
      "block";

    hideStatus();

  } catch (error) {

    hideStatus();
    alert(t.routeError);

  } finally {

    button.disabled = false;
  }
}


function startPreview() {

  if (!currentRoute || !routeCoordinates.length) {
    return;
  }

  stopPreview(false);

  previewIndex = 0;

  document.getElementById(
    "navigationBox"
  ).style.display = "block";

  document.getElementById(
    "previewButton"
  ).style.display = "none";

  document.getElementById(
    "stopButton"
  ).style.display = "block";

  if (carMarker) {
    map.removeLayer(carMarker);
  }

  carMarker =
    L.marker(
      routeCoordinates[0],
      {
        icon: carIcon,
        zIndexOffset: 1000
      }
    ).addTo(map);

  map.setView(
    routeCoordinates[0],
    17
  );

  updateInstruction(
    routeCoordinates[0]
  );

  previewTimer =
    setInterval(
      movePreview,
      220
    );
}


function movePreview() {

  previewIndex +=
    Math.max(
      1,
      Math.floor(routeCoordinates.length / 700)
    );

  if (
    previewIndex >=
    routeCoordinates.length
  ) {

    finishPreview();
    return;
  }

  const position =
    routeCoordinates[previewIndex];

  carMarker.setLatLng(position);

  map.panTo(
    position,
    {
      animate: true,
      duration: .2
    }
  );

  const progress =
    (
      previewIndex /
      (routeCoordinates.length - 1)
    ) * 100;

  document.getElementById(
    "progressBar"
  ).style.width =
    progress + "%";

  updateInstruction(position);
}


function updateInstruction(position) {

  if (!routeSteps.length) {
    return;
  }

  let nearestStep = null;
  let nearestDistance = Infinity;

  for (let i = 0; i < routeSteps.length; i++) {

    const maneuver =
      routeSteps[i].maneuver;

    if (
      !maneuver ||
      !maneuver.location
    ) {
      continue;
    }

    const stepPoint = [
      maneuver.location[1],
      maneuver.location[0]
    ];

    const distance =
      map.distance(
        position,
        stepPoint
      );

    if (
      distance < nearestDistance
    ) {

      nearestDistance = distance;
      nearestStep = routeSteps[i];
    }
  }

  if (!nearestStep) {
    return;
  }

  const instruction =
    translateManeuver(
      nearestStep.maneuver
    );

  document.getElementById(
    "turnIcon"
  ).textContent =
    instruction.icon;

  document.getElementById(
    "instructionText"
  ).textContent =
    instruction.text;

  document.getElementById(
    "instructionDistance"
  ).textContent =
    formatNavigationDistance(
      nearestDistance
    );
}


function translateManeuver(maneuver) {

  const t =
    translations[currentLanguage];

  const modifier =
    maneuver.modifier || "";

  const type =
    maneuver.type || "";

  if (
    type === "arrive"
  ) {

    return {
      icon: "🏁",
      text: t.arrive
    };
  }

  if (
    type === "roundabout" ||
    type === "rotary"
  ) {

    return {
      icon: "↻",
      text: t.roundabout
    };
  }

  if (
    modifier === "right"
  ) {

    return {
      icon: "➡️",
      text: t.right
    };
  }

  if (
    modifier === "left"
  ) {

    return {
      icon: "⬅️",
      text: t.left
    };
  }

  if (
    modifier === "slight right"
  ) {

    return {
      icon: "↗️",
      text: t.slightRight
    };
  }

  if (
    modifier === "slight left"
  ) {

    return {
      icon: "↖️",
      text: t.slightLeft
    };
  }

  if (
    modifier === "uturn"
  ) {

    return {
      icon: "↩️",
      text: t.uturn
    };
  }

  return {
    icon: "⬆️",
    text: t.straight
  };
}


function formatNavigationDistance(meters) {

  const t =
    translations[currentLanguage];

  if (meters < 1000) {

    const rounded =
      Math.max(
        10,
        Math.round(meters / 10) * 10
      );

    return (
      t.after +
      " " +
      rounded +
      " " +
      t.meter
    );
  }

  return (
    t.after +
    " " +
    (meters / 1000).toFixed(1) +
    " " +
    t.km
  );
}


function finishPreview() {

  clearInterval(previewTimer);
  previewTimer = null;

  const t =
    translations[currentLanguage];

  if (routeCoordinates.length) {

    const last =
      routeCoordinates[
        routeCoordinates.length - 1
      ];

    carMarker.setLatLng(last);

    map.panTo(last);
  }

  document.getElementById(
    "turnIcon"
  ).textContent = "🏁";

  document.getElementById(
    "instructionText"
  ).textContent =
    t.arrive;

  document.getElementById(
    "instructionDistance"
  ).textContent = "";

  document.getElementById(
    "progressBar"
  ).style.width =
    "100%";

  document.getElementById(
    "stopButton"
  ).style.display =
    "none";

  document.getElementById(
    "previewButton"
  ).style.display =
    "block";
}


function stopPreview(
  hideNavigation = true
) {

  if (previewTimer) {

    clearInterval(previewTimer);
    previewTimer = null;
  }

  if (carMarker) {

    map.removeLayer(carMarker);
    carMarker = null;
  }

  document.getElementById(
    "stopButton"
  ).style.display =
    "none";

  if (
    currentRoute &&
    routeCoordinates.length
  ) {

    document.getElementById(
      "previewButton"
    ).style.display =
      "block";
  }

  if (hideNavigation) {

    document.getElementById(
      "navigationBox"
    ).style.display =
      "none";
  }

  document.getElementById(
    "progressBar"
  ).style.width =
    "0%";
}


function formatDuration(minutes) {

  const t =
    translations[currentLanguage];

  if (minutes < 60) {
    return minutes + " " + t.min;
  }

  const hours =
    Math.floor(minutes / 60);

  const remaining =
    minutes % 60;

  if (!remaining) {
    return hours + " " + t.hour;
  }

  return (
    hours +
    " " +
    t.hour +
    " " +
    remaining +
    " " +
    t.min
  );
}


document
  .getElementById("languageSelect")
  .addEventListener(
    "change",
    function() {
      setLanguage(this.value);
    }
  );


document
  .getElementById("toInput")
  .addEventListener(
    "keydown",
    function(event) {

      if (event.key === "Enter") {
        calculateRoute();
      }
    }
  );


const savedLanguage =
  localStorage.getItem(
    "almaLanguage"
  );

if (
  savedLanguage &&
  translations[savedLanguage]
) {

  document.getElementById(
    "languageSelect"
  ).value =
    savedLanguage;

  setLanguage(savedLanguage);

} else {

  setLanguage("ar");
}

</script>
